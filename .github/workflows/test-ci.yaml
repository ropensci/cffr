on:
  workflow_dispatch:
  schedule:
  - cron: "0 5 * * 2,5"

permissions:
  contents: read

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

name: Test on GHA

jobs:
  test-ci:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache-version: "test_full_ci"
        cache: "always"
        extra-packages: |
          local::.
          any::devtools
          any::remotes
          any::tidymodels
          any::tidyverse
          any::ctv
          any::cranlogs

    - name: Compute packages to install
      run: |
        options(repos = c(CRAN = "https://cloud.r-project.org"))

        library(magrittr)
        library(dplyr)
        library(httr2)

        # Downloads
        trending <- request("https://cranlogs.r-pkg.org/trending") %>%
          req_perform() %>%
          resp_body_json(simplifyVector = TRUE) %>%
          select(1) %>%
          pull(1)

        last_month <- cranlogs::cran_top_downloads("last-month", count = 100) %>%
          select(package) %>%
          pull()

        # Views

        allviews <- ctv::available.views()
        packs <- lapply(seq_len(length(allviews)), function(x) {
          df <- allviews[[x]]$packagelist
          tibble::add_column(df, view = allviews[[x]]$name)
        }) %>%
          dplyr::bind_rows() %>%
          as_tibble()
        packs <- dplyr::bind_rows(packs)
        core <- dplyr::filter(packs, core == TRUE) %>%
          pull(1)

        # Selected non-core packages from CRAN Task Views
        sel_views <- packs %>%
          filter(core == FALSE) %>%
          slice_head(n = 4500) %>%
          pull(name)

        # rOpenSci packages from r-universe
        ropensci <- jsonlite::read_json("https://ropensci.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()
        ropenscireviewtools <- jsonlite::read_json("https://ropensci-review-tools.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        # R-lib packages
        rlib <- jsonlite::read_json("https://r-lib.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        # R-forge packages
        rforge <- jsonlite::read_json("https://r-forge.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        # R-Studio packages
        rstudio <- jsonlite::read_json("https://rstudio.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        # rspatial packages
        rspatial <- jsonlite::read_json("https://r-spatial.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        # My universes packages
        dieghernan <- jsonlite::read_json("https://dieghernan.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        ropenspain <- jsonlite::read_json("https://ropenspain.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        ropengov <- jsonlite::read_json("https://ropengov.r-universe.dev/api/packages") %>%
          lapply("[[", "Package") %>%
          unlist()

        # Packages that have exposed citation metadata edge cases
        stress_packages <- c(
          "codemetar",
          "ctrdata",
          "MomTrunc",
          "options",
          "quint",
          "resmush",
          "Rdimtools",
          "rmarkdown",
          "RNeXML",
          "surveillance",
          "vcfR"
        )

        # Gather packages
        all <- sort(unique(c(
          trending, last_month,
          core, sel_views, ropensci, ropenscireviewtools, rlib, rforge, rstudio, rspatial,
          dieghernan, ropenspain, ropengov, stress_packages
        )))

        dir.create(".github", showWarnings = FALSE)
        writeLines(all, ".github/test-ci-packages.txt")
        message("Found ", length(all), " packages to check")

      shell: Rscript {0}

    - name: Record R version
      id: r-version
      run: |
        cat("version=", as.character(getRversion()), "\n", file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)
        cat("arch=", R.Version()$arch, "\n", file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)

      shell: Rscript {0}

    - name: Test CI package cache restore
      id: test-ci-package-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ env.R_LIBS_USER }}/*
          !${{ env.R_LIBS_USER }}/pak
          !${{ env.R_LIBS_USER }}/_cache
        key: test-ci-extra-${{ runner.os }}-${{ steps.r-version.outputs.version }}-${{ steps.r-version.outputs.arch }}-${{ hashFiles('.github/test-ci-packages.txt') }}
        restore-keys: |
          test-ci-extra-${{ runner.os }}-${{ steps.r-version.outputs.version }}-${{ steps.r-version.outputs.arch }}-

    - name: Install packages
      run: |
        all <- readLines(".github/test-ci-packages.txt", warn = FALSE)

        # Check packages not installed yet
        instpack <- as.character(installed.packages()[, "Package"])
        toinstall_init <- setdiff(all, instpack)
        lib <- Sys.getenv("R_LIBS_USER")
        stopifnot(nzchar(lib))
        dir.create(lib, recursive = TRUE, showWarnings = FALSE)

        # Install
        options(repos = c(
          ropensci = "https://ropensci.r-universe.dev",
          ropenscireviewtools = "https://ropensci-review-tools.r-universe.dev",
          RSPM = "https://packagemanager.posit.co/cran/latest",
          CRAN = "https://cloud.r-project.org"
        ))

        # Check packages available
        pakav <- as.data.frame(available.packages(repos = getOption("repos")))
        toinstall <- toinstall_init[toinstall_init %in% pakav$Package]
        message(
          "Installing ", length(toinstall), " packages of ",
          nrow(pakav), " available"
        )

        if (length(toinstall) > 0) {
          install.packages(toinstall, lib = lib)
        }

      shell: Rscript {0}

    - name: Test CI package cache save
      if: ${{ steps.test-ci-package-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ env.R_LIBS_USER }}/*
          !${{ env.R_LIBS_USER }}/pak
          !${{ env.R_LIBS_USER }}/_cache
        key: ${{ steps.test-ci-package-cache.outputs.cache-primary-key }}

    - name: Test GHA
      run: |
        
        # Run the tests
        source("tests/testthat/test_ci/test-new.R")

      shell: Rscript {0}
      # Report on success
    - name: Report success
      shell: bash
      run: |
        # OK :)
        cat ./tests/testthat/test_ci/results.md >$GITHUB_STEP_SUMMARY
